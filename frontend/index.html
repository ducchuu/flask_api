<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse - Your Multi-Source Feed</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Local Styles -->
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* Specific overrides for index page */
        body { justify-content: center; align-items: center; }
        .hero { margin-bottom: 2rem; }
        .auth-container { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 900px; }
    </style>
</head>
<body>

    <div class="auth-wrapper flex-col">
        <div class="container flex-col items-center">
            <!-- Hero Section -->
            <div class="hero">
                <h1 class="logo" style="justify-content: center; font-size: 3.5rem; margin-bottom: 1rem;"><i class="fas fa-bolt"></i> Pulse</h1>
                <p>Your personalized, multi-source feed reader. Aggregate News, Videos, and Discussions all in one timeline.</p>
            </div>

        <!-- Auth Forms -->
        <div class="auth-container">
            <!-- Login Card -->
            <div class="auth-card" id="login-card">
                <div class="auth-header">
                    <h2>Login</h2>
                    <p>Welcome back to Pulse</p>
                </div>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" class="form-control" required placeholder="Enter your username">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" class="form-control" required placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                </form>
            </div>

            <!-- Register Card -->
            <div class="auth-card" id="register-card">
                <div class="auth-header">
                    <h2>Register</h2>
                    <p>Create a new account</p>
                </div>
                <form id="register-form">
                    <div class="form-group">
                        <label for="register-username">Choose Username</label>
                        <input type="text" id="register-username" class="form-control" required placeholder="Pick a username">
                    </div>
                    <div class="form-group">
                        <label for="register-password">Choose Password</label>
                        <input type="password" id="register-password" class="form-control" required placeholder="Create a password">
                    </div>
                    <button type="submit" class="btn btn-outline" style="width: 100%; margin-top: 1rem; color: var(--accent-primary); border-color: var(--accent-primary);">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>
            </div>
        </div>
    </div>
    </div>

    <script type="module">
        import { api } from './js/api.js';
        import { showToast } from './js/app.js';

        // Login Logic
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            
            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
                btn.disabled = true;

                const response = await api.post('/api/tokens', { username, password });
                localStorage.setItem('pulse_token', response.token);
                localStorage.setItem('pulse_user', JSON.stringify(response.user));
                
                showToast('Login successful!', 'success');
                setTimeout(() => window.location.href = '/timeline.html', 500);

            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // Register Logic
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            
            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registering...';
                btn.disabled = true;

                const response = await api.post('/api/users', { username, password });
                localStorage.setItem('pulse_token', response.token);
                localStorage.setItem('pulse_user', JSON.stringify(response.user));
                
                showToast('Registration successful!', 'success');
                setTimeout(() => window.location.href = '/onboarding.html', 500);

            } catch (err) {
                showToast(err.message, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
